name: ci
# Skips files no check reads; skill .md files are validated, so never ignore **.md.
on:
  push:
    paths-ignore:
      - README.md
      - SECURITY.md
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md
      - CHANGELOG.md
      - GLOSSARY.md
      - docs/**
      - .github/DISCUSSION_TEMPLATE/**
  pull_request:
    paths-ignore:
      - README.md
      - SECURITY.md
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md
      - CHANGELOG.md
      - GLOSSARY.md
      - docs/**
      - .github/DISCUSSION_TEMPLATE/**
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh tests/commit-msg.test.sh
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate plugins/odhyp
